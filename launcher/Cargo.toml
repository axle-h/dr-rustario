[package]
name = "dr-rustario-vs-rustris"
version = "2.0.0"
authors.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "dr-rustario-vs-rustris"
path = "src/main.rs"

[features]
default = ["pkgconfig", "ai"]
vcpkg = ["engine/vcpkg"]
pkgconfig = ["engine/pkgconfig"]
retro_handheld = ["engine/retro_handheld"]
ai = ["rustris/ai"]

[build-dependencies]
built = { version = "0.8.1", default-features = false, features = [] }
embed-resource = "3.0.11"

[dependencies]
engine = { path = "../engine" }
dr-rustario = { path = "../dr-rustario" }
rustris = { path = "../rustris" }
sdl2.workspace = true
titlecase.workspace = true
