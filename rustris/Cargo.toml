[package]
name = "rustris"
authors = ["Alex Haslehurst"]
version = "1.2.0"
edition = "2021"
resolver = "2"

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
tag = "2024.04.26"
dependencies = ["sdl2", "sdl2-image", "sdl2-gfx", "sdl2-mixer", "sdl2-ttf"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }

[features]
default = ["pkgconfig"]
vcpkg = ["sdl2/static-link", "sdl2/use-vcpkg"]
pkgconfig = ["sdl2/use-pkgconfig"]
retro_handheld = []

[build-dependencies]
built = { version = "0.8.1", default-features = false, features = [] }
embed-resource = "3.0.11"

[dev-dependencies]
approx = "0.5"


[dependencies]
rand = "0.10.2"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0"
bitflags = "2.13.1"
sdl2 = { version = "0.38.0", default-features = false, features = ["image","gfx","mixer","ttf"] }
confy = { version = "2.0.0", default-features = false, features = ["yaml_conf"] }
num-format = "0.4.4"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
rayon = "1.12.0"
itertools = "0.15.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"



[profile.release]
strip = "symbols"
